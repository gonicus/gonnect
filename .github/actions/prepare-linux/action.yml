name: 'GOnnect prepare action [Linux build]'
description: 'Recurring tasks for CI jobs'
inputs:
  deps:
    description: 'Install Dependencies'
    default: 'true'
  qt:
    description: 'Install Qt'
    default: 'true'
  conan:
    description: 'Install conan'
    default: 'true'
outputs:
  qt-version:
    description: 'QT version'
    value: ${{ steps.get-qt.outputs.qt-version }}

runs:
  using: 'composite'
  steps:

    - name: Setup ccache
      if: inputs.deps == 'true'
      uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1
      with:
        key: ${{ runner.os }}-release
        max-size: 2G

    - name: Install dependencies
      shell: bash
      if: inputs.deps == 'true'
      run: |
        sudo apt-get update
        sudo apt install -y --no-install-recommends ninja-build llvm libudev-dev libsasl2-dev libsecret-1-dev \
            libnotify-dev libebook-contacts1.2-dev libebook1.2-dev libecal2.0-dev libedata-cal2.0-dev libedata-book1.2-dev \
            libprotoc-dev libprotobuf-dev protobuf-compiler libpipewire-0.3-dev libx11-xcb-dev libfontenc-dev libice-dev \
            libsm-dev libxaw7-dev libxcomposite-dev libxcursor-dev libxdamage-dev libxext-dev libxfixes-dev libxi-dev \
            libxinerama-dev libxkbfile-dev libxmu-dev libxmuu-dev libxpm-dev libxrandr-dev libxrender-dev libxres-dev \
            libxss-dev libxt-dev libxtst-dev libxv-dev libxxf86vm-dev libxcb-glx0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-dri3-dev libxcb-cursor-dev \
            libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev \
            libxcb-util-dev libwayland-dev

    - name: Get QT-Version
      if: inputs.qt == 'true'
      id: get-qt
      uses: ./.github/actions/get-qt-version

    - name: Install Qt
      if: inputs.qt == 'true'
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
      with:
        version: ${{ steps.get-qt.outputs.qt-version }}
        host: 'linux'
        target: 'desktop'
        modules: 'qtmultimedia qtwebengine qtwebchannel qtnetworkauth qtpositioning qtwebsockets qtgrpc'
        arch: 'linux_gcc_64'
        cache: true

    - name: Install Conan
      if: inputs.conan == 'true'
      uses: conan-io/setup-conan@5db0275587014d13a5ca698db681ce4782a6e052 # v1
      with:
        version: 2.33.0
        cache_packages: true

    - name: Install Conan dependencies
      if: inputs.conan == 'true'
      shell: bash
      run: |
        conan config install resources/conan
        conan export-dependencies .
        conan install . --build=missing -ctools.cmake.cmaketoolchain:generator=Ninja -s compiler.cppstd=20
