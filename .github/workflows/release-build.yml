name: GOnnect Publish

# Builds all packages for a release tag and attaches them to its GitHub release.
# Called by the release workflow after semantic-release created the tag. It can
# be dispatched manually to (re-)attach the packages to an existing release.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v1.2.3)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v1.2.3)
        type: string
        required: true

jobs:
  packages:
    name: "Build packages"
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-packages.yml
    secrets: inherit
    with:
      ref: ${{ inputs.tag }}
      windows: true
      # Do not build the MacOS package for now, as it is not tested.
      macos: false
      flatpak: true
      sign: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' }}

  publish:
    name: "Upload to release"
    runs-on: ubuntu-26.04
    needs: packages
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: packages
          merge-multiple: true

      - name: Upload packages to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          mkdir release
          mv packages/*.msix "release/GOnnect-$VERSION.msix"
          mv packages/*.dmg "release/GOnnect-$VERSION.dmg"
          mv packages/*.flatpak "release/GOnnect-$VERSION.flatpak"
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
