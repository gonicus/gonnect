name: GOnnect Publish

# Builds all packages for a release tag and attaches them to its GitHub release.
# Called by the release workflow after semantic-release created the tag. It can
# be dispatched manually to (re-)attach the packages to an existing release.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v1.2.3)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v1.2.3)
        type: string
        required: true

jobs:
  packages:
    name: "Build packages"
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-packages.yml
    secrets: inherit
    with:
      ref: ${{ inputs.tag }}
      windows: true
      # Do not build the MacOS package for now, as it is not tested.
      macos: false
      flatpak: true
      sign: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' || github.ref == 'refs/heads/freeze/beta' }}

  publish:
    name: "Upload to release"
    runs-on: ubuntu-26.04
    needs: packages
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: packages
          merge-multiple: true

      - name: Upload packages to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          mkdir release
          # Copy the created files. Which files were created depends on the parameters given to the build packages job.
          for ext in msix dmg flatpak; do
            for f in packages/*.$ext; do
              [ -e "$f" ] && mv "$f" "release/GOnnect-$VERSION.$ext"
            done
          done
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
