name: GOnnect Packages

# Builds the platform packages. Used by the CI and the release workflows, so
# both produce identical binaries. The resulting packages are stored as
# workflow artifacts only - publishing them is up to the caller.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering commit)
        type: string
        default: ''
      windows:
        description: Build the Windows package
        type: boolean
        default: false
      macos:
        description: Build the MacOS package
        type: boolean
        default: false
      flatpak:
        description: Build the Flatpak package
        type: boolean
        default: false
      sign:
        description: Sign the Windows application and create the MSIX package
        type: boolean
        default: false

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  EXT_BASE: ${{github.workspace}}

jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    name: "Build GOnnect (Windows)"
    if: ${{ inputs.windows }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          lfs: 'true'
          submodules: 'recursive'

      - name: Prepare
        uses: ./.github/actions/prepare-windows

      - name: Configure CMake
        shell: cmd
        run: cmake --preset conan-default -DENABLE_MSGRAPH=ON -DMS_APPLICATION_IDENTIFIER=${{ secrets.AZURE_CLIENT_ID }}
        env:
          NSIS_USE_FAST_COMPRESSION: "1"

      - name: Build application
        run: cmake --build --preset conan-release

      - name: Azure Login via OIDC
        if: ${{ inputs.sign }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign application
        if: ${{ inputs.sign }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: GONICUS-signing
          certificate-profile-name: gonicus-profile
          files: ${{ github.workspace }}/build/Release/GOnnect.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build MSIX layout
        if: ${{ inputs.sign }}
        shell: powershell
        run: |
          $workspace = "${{ github.workspace }}"
          New-Item -ItemType Directory -Path "$workspace/msix-layout" -Force

          Copy-Item "$workspace/build/Release/gonnect.exe" "$workspace/msix-layout/gonnect.exe"

          $windeployqt = "$env:QT_ROOT_DIR\bin\windeployqt.exe"
          & $windeployqt `
            --qmldir "$workspace/src" `
            --plugindir "$workspace/msix-layout/plugins" `
            --no-translations `
            --release `
            "$workspace/msix-layout/gonnect.exe"

          Copy-Item "$workspace/build/AppxManifest.xml" "$workspace/msix-layout/AppxManifest.xml"
          Copy-Item -Recurse "resources/windows/msix/Assets" "$workspace/msix-layout/Assets"

      - name: Pack MSIX
        if: ${{ inputs.sign }}
        shell: powershell
        run: |
          $makeappx = Get-ChildItem `
            -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "makeappx.exe" |
            Sort-Object FullName | Select-Object -Last 1
          & $makeappx.FullName pack /d msix-layout /p build/GOnnect.msix /nv

      - name: Sign MSIX release artifact
        if: ${{ inputs.sign }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: GONICUS-signing
          certificate-profile-name: gonicus-profile
          files: ${{ github.workspace }}/build/GOnnect.msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Save MSIX
        if: ${{ inputs.sign }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-msix
          compression-level: 0
          path: build/GOnnect*.msix

  build-macos:
    runs-on: macos-26
    name: "Build GOnnect (MacOS)"
    if: ${{ inputs.macos }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          lfs: 'true'
          submodules: 'recursive'

      - name: Prepare
        uses: ./.github/actions/prepare-macos

      - name: Configure CMake
        run: cmake --preset conan-release

      - name: Build
        run: cmake --build --preset conan-release

      - name: Package
        run: cd build/Release && cpack ${{github.workspace}}

      - name: Save installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mac-installer.dmg
          compression-level: 0
          path: build/Release/GOnnect*.dmg

  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-24.04
    if: ${{ inputs.flatpak }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          lfs: 'true'
          submodules: 'recursive'

      - name: Reading GOnnect version
        shell: bash
        id: var
        run: |
          echo "gonnect_version=$(grep -oP 'GOnnect VERSION ([0-9.]+)' CMakeLists.txt | awk '{ print $3 }')" >> $GITHUB_OUTPUT

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: GOnnect.flatpak
          build-bundle: 'true'
          upload-artifact: 'true'
          manifest-path: resources/flatpak/de.gonicus.gonnect.yml
          cache-key: flatpak-builder-${{ steps.var.outputs.gonnect_version }}
